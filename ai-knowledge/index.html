<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI编程知识体系 - 学习导航</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm border-b border-gray-200 fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button id="sidebar-toggle" class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h1 class="text-xl font-bold text-blue-600">AI编程知识体系</h1>
            </div>
            
            <div class="flex-1 max-w-md mx-4">
                <input type="text" id="search-input" placeholder="搜索知识点..." 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="home-btn" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                    🏠 导图
                </button>
                <div class="hidden md:flex items-center space-x-4 text-sm text-gray-600">
                    <span>进度:</span>
                    <span id="progress-text" class="font-semibold text-blue-600">0/0</span>
                    <span class="mx-1">|</span>
                    <span id="checkin-status" class="text-green-600"></span>
                </div>
                <button id="checkin-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    每日打卡
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="flex pt-16 min-h-screen">
        <!-- 左侧导航栏 -->
        <aside id="sidebar" class="w-64 bg-white shadow-sm border-r border-gray-200 fixed left-0 top-16 bottom-0 overflow-y-auto transition-transform duration-300 z-40">
            <nav class="p-4">
                <!-- 新增按钮 -->
                <button id="add-section-btn" class="w-full mb-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    新增章节
                </button>
                
                <div id="navigation-tree" class="space-y-2">
                    <!-- 导航树将在这里动态生成 -->
                </div>
            </nav>
        </aside>

        <!-- 移动端遮罩 -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

        <!-- 右侧内容区 -->
        <main id="content-area" class="flex-1 ml-64 p-8 transition-all duration-300">
            <!-- 思维导图首页 -->
            <div id="mindmap-page" class="w-full h-full hidden">
                <!-- 缩放控制（fixed定位，确保始终可见） -->
                <div id="mindmap-controls" style="position:fixed;top:80px;right:24px;z-index:9999;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:6px 10px;align-items:center;gap:4px;display:none;">
                    <button id="back-home" style="width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;font-size:16px;" title="返回首页" onmouseover="this.style.background='#f0f4ff';this.style.color='#667eea'" onmouseout="this.style.background='transparent';this.style.color='#888'">🏠</button>
                    <div style="width:1px;height:20px;background:#e0e0e0;"></div>
                    <button id="zoom-out" style="width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;font-size:18px;" title="缩小" onmouseover="this.style.background='#f0f4ff';this.style.color='#667eea'" onmouseout="this.style.background='transparent';this.style.color='#888'">−</button>
                    <span id="zoom-level" style="font-size:13px;font-weight:bold;color:#333;min-width:44px;text-align:center;">100%</span>
                    <button id="zoom-in" style="width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;font-size:18px;" title="放大" onmouseover="this.style.background='#f0f4ff';this.style.color='#667eea'" onmouseout="this.style.background='transparent';this.style.color='#888'">+</button>
                    <div style="width:1px;height:20px;background:#e0e0e0;"></div>
                    <button id="zoom-reset" onclick="Mindmap.resetView()" style="width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:#bbb;cursor:pointer;" title="重置视图" onmouseover="this.style.background='#f5f5f5';this.style.color='#666'" onmouseout="this.style.background='transparent';this.style.color='#bbb'">↺</button>
                </div>

                <!-- 思维导图容器 -->
                <div id="mindmap-container" class="relative w-full h-full overflow-visible">
                    <!-- 缩放内容层 -->
                    <div id="mindmap-content" class="relative w-full h-full">
                        <!-- 中心节点 -->
                        <div id="mindmap-center" class="absolute transform -translate-x-1/2 -translate-y-1/2 bg-blue-600 text-white px-8 py-4 rounded-full shadow-lg cursor-pointer hover:bg-blue-700 transition-all z-10">
                            <div class="text-center">
                                <div class="text-2xl mb-1">🧠</div>
                                <div class="font-bold text-lg">AI编程知识体系</div>
                            </div>
                        </div>
                        
                        <!-- SVG连线层 -->
                        <svg id="mindmap-lines" class="absolute inset-0 w-full h-full pointer-events-none z-0">
                        </svg>
                        
                        <!-- 一级节点容器 -->
                        <div id="mindmap-nodes" class="absolute inset-0">
                            <!-- 节点将通过JS动态生成 -->
                        </div>
                    </div>
                </div>
                
                <!-- 提示框 -->
                <div class="absolute bottom-4 left-4 bg-white bg-opacity-90 p-4 rounded-lg shadow-lg">
                    <p class="text-gray-600 text-sm">💡 点击模块节点查看详情，再次点击收起 | 右上角可调整缩放</p>
                </div>
            </div>

            <!-- 欢迎页面 -->
            <div id="welcome-page" class="max-w-4xl mx-auto">
                <!-- 顶部操作栏 -->
                <div class="flex items-center justify-end gap-2 mb-4">
                    <button id="welcome-zoom-out" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-gray-100 transition-colors" title="缩小">−</button>
                    <span id="welcome-zoom-level" class="text-sm text-gray-600 w-12 text-center">100%</span>
                    <button id="welcome-zoom-in" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-gray-100 transition-colors" title="放大">+</button>
                    <button id="welcome-zoom-reset" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-gray-100 transition-colors" title="重置">↺</button>
                </div>
                
                <!-- 可缩放的首页内容 -->
                <div id="welcome-content">
                    <div class="text-center mb-8">
                        <h2 class="text-4xl font-bold text-gray-800 mb-4">欢迎来到AI编程知识体系</h2>
                        <p class="text-xl text-gray-600">系统学习AI编程，从基础到实战</p>
                    </div>
                    
                    <!-- 轮播图区域 -->
                    <div class="relative mb-8">
                        <div id="carousel" class="overflow-hidden rounded-xl">
                            <div id="carousel-track" class="flex transition-transform duration-500">
                                <div class="w-full flex-shrink-0 bg-gradient-to-r from-blue-500 to-purple-600 p-8 text-white">
                                    <div class="flex items-center gap-6">
                                        <div class="text-5xl">📚</div>
                                        <div>
                                            <h3 class="text-2xl font-bold mb-2">12个知识模块</h3>
                                            <p class="opacity-90">从AI发展史到大模型，系统掌握AI编程核心知识</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="w-full flex-shrink-0 bg-gradient-to-r from-blue-500 to-purple-600 p-8 text-white">
                                    <div class="flex items-center gap-6">
                                        <div class="text-5xl">✅</div>
                                        <div>
                                            <h3 class="text-2xl font-bold mb-2">进度追踪</h3>
                                            <p class="opacity-90">自动保存学习进度，随时查看完成情况</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="w-full flex-shrink-0 bg-gradient-to-r from-blue-500 to-purple-600 p-8 text-white">
                                    <div class="flex items-center gap-6">
                                        <div class="text-5xl">🖥️</div>
                                        <div>
                                            <h3 class="text-2xl font-bold mb-2">新页面编辑</h3>
                                            <p class="opacity-90">支持三种模式：浏览、编写、边写边预览</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="w-full flex-shrink-0 bg-gradient-to-r from-blue-500 to-purple-600 p-8 text-white">
                                    <div class="flex items-center gap-6">
                                        <div class="text-5xl">🎯</div>
                                        <div>
                                            <h3 class="text-2xl font-bold mb-2">每日打卡</h3>
                                            <p class="opacity-90">坚持每日学习，养成良好习惯</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 轮播指示器 -->
                        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2">
                            <button class="carousel-dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition-colors active" data-index="0"></button>
                            <button class="carousel-dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition-colors" data-index="1"></button>
                            <button class="carousel-dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition-colors" data-index="2"></button>
                            <button class="carousel-dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition-colors" data-index="3"></button>
                        </div>
                        <!-- 左右箭头 -->
                        <button id="carousel-prev" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-colors">‹</button>
                        <button id="carousel-next" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-colors">›</button>
                    </div>

                    <div class="bg-blue-50 border-l-4 border-blue-600 p-4 rounded">
                        <p class="text-blue-800">💡 提示：点击左侧导航树开始学习，使用搜索框快速定位知识点</p>
                    </div>
                </div>
            </div>

            <!-- 内容展示区 -->
            <div id="content-display" class="hidden flex-1 flex flex-col min-h-0">
                <!-- 操作栏 -->
                <div id="content-controls" class="flex items-center justify-between px-4 py-2 bg-gray-50 border-b border-gray-200">
                    <div class="flex items-center gap-2">
                        <button id="back-to-home" class="flex items-center gap-1 px-3 py-1.5 rounded hover:bg-gray-200 transition-colors text-gray-600">
                            <span>←</span>
                            <span>返回首页</span>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="content-zoom-out" class="w-8 h-8 rounded flex items-center justify-center hover:bg-gray-200 transition-colors" title="缩小">−</button>
                        <span id="content-zoom-level" class="text-sm text-gray-600 w-12 text-center">100%</span>
                        <button id="content-zoom-in" class="w-8 h-8 rounded flex items-center justify-center hover:bg-gray-200 transition-colors" title="放大">+</button>
                        <button id="content-zoom-reset" class="w-8 h-8 rounded flex items-center justify-center hover:bg-gray-200 transition-colors" title="重置">↺</button>
                    </div>
                </div>
                <!-- 可缩放内容区 -->
                <div id="content-zoom-wrapper" class="flex-1 overflow-auto">
                    <div id="content-body" class="max-w-4xl mx-auto p-6 transition-transform origin-top-left">
                        <!-- 内容将在这里动态加载 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 打卡弹窗 -->
    <div id="checkin-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-screen overflow-y-auto m-4">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold text-gray-800">每日打卡</h2>
                    <button id="close-checkin" class="text-gray-400 hover:text-gray-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-6">
                <!-- 打卡日历 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4">打卡日历</h3>
                    <div id="calendar" class="grid grid-cols-7 gap-2">
                        <!-- 日历将在这里生成 -->
                    </div>
                    <div class="mt-4 flex items-center space-x-4 text-sm text-gray-600">
                        <div class="flex items-center space-x-2">
                            <div class="w-4 h-4 bg-green-500 rounded"></div>
                            <span>已打卡</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-4 h-4 bg-gray-200 rounded"></div>
                            <span>未打卡</span>
                        </div>
                    </div>
                </div>

                <!-- 今日目标 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4">今日学习目标</h3>
                    <div id="today-goals" class="space-y-2">
                        <!-- 目标列表 -->
                    </div>
                    <div class="mt-4 flex space-x-2">
                        <input type="text" id="new-goal-input" placeholder="添加新目标..." 
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <button id="add-goal-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            添加
                        </button>
                    </div>
                </div>

                <!-- 打卡按钮 -->
                <div class="text-center mb-6">
                    <button id="checkin-action-btn" class="px-8 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-semibold">
                        立即打卡
                    </button>
                    <button id="cancel-checkin-btn" class="hidden ml-4 px-6 py-3 bg-gray-400 text-white rounded-lg hover:bg-gray-500 transition-colors font-semibold">
                        取消打卡
                    </button>
                </div>

                <!-- 每日总结编辑器 -->
                <div id="summary-editor-container">
                    <!-- 总结编辑器将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 新增章节弹窗 -->
    <div id="add-section-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-screen overflow-hidden m-4">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-gray-800">新增章节</h2>
                    <button id="close-add-modal" class="text-gray-400 hover:text-gray-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-6 max-h-96 overflow-y-auto">
                <div class="space-y-4">
                    <!-- 章节图标 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择图标</label>
                        <div class="flex flex-wrap gap-2">
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors selected" data-icon="📚">📚</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="💻">💻</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="🔧">🔧</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="🚀">🚀</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="🎯">🎯</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="⚡">⚡</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="🔥">🔥</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="✨">✨</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="🌟">🌟</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="💡">💡</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="📝">📝</button>
                            <button class="icon-picker p-2 text-2xl hover:bg-gray-100 rounded-lg transition-colors" data-icon="🎨">🎨</button>
                        </div>
                    </div>
                    
                    <!-- 章节标题 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">章节标题</label>
                        <input type="text" id="new-chapter-title" placeholder="例如：我的笔记"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                    </div>
                    
                    <!-- 章节内容 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">章节内容</label>
                        <textarea id="new-chapter-content" rows="8" placeholder="在这里编写章节的学习内容..."
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none font-mono text-sm"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-end gap-3">
                    <button id="cancel-add-section" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                        取消
                    </button>
                    <button id="confirm-add-section" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        添加
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/search.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/checklist.js"></script>
    <script src="js/summary.js"></script>
    <script src="js/mindmap.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
